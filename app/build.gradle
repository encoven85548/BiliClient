plugins {
    id 'com.android.application'
}

int betaVer = 0 //如果为0则是正式版，1为测试版（如为1则应用后缀带beta）

// ===== 签名信息（统一从 local.properties 读取，该文件与 key.jks 都在 .gitignore 里）=====
// 以前这里写的是 pro.getProperty("KEY_PATH")，pro 根本没有定义过，
// 所以只要 local.properties 里出现了 KEY_PATH，配置阶段就会直接抛 MissingPropertyException，
// 正式签名永远配不出来。这里改成老老实实读一份 Properties。
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("local.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingKeyPath = keystoreProps.getProperty("KEY_PATH")
def hasSigningKey = signingKeyPath != null && !signingKeyPath.trim().isEmpty()
def signingKeyFile = null
if (hasSigningKey) {
    def f = new File(signingKeyPath.trim())
    // 相对路径按"项目根目录"解析：KEY_PATH=key.jks 就是 <项目>/key.jks，
    // 不用管这段代码在哪个模块里（file("key.jks") 在 app 模块里会跑到 app/key.jks 去）
    signingKeyFile = f.isAbsolute() ? f : rootProject.file(signingKeyPath.trim())
}

android {

    namespace 'com.RobinNotBad.BiliClient'
    //noinspection GradleDependency
    compileSdk 33

    sourceSets {
        main{
            jniLibs.srcDirs = ['libs']
            java {
                exclude '**/GeetestUtil.java'
            }
        }
    }

    defaultConfig {
        applicationId "COM.ROBINNOTBAD.BILICLIENT"
        minSdk 14
        //noinspection ExpiredTargetSdkVersion
        targetSdk 26
        versionCode 20261026
        versionName "E-1.1"

        if (betaVer) {
            versionName += "-BETA" + betaVer
        }

        // 正式版(betaVer=0)应用名不带后缀，测试版(betaVer>0)带 BETA 后缀
        manifestPlaceholders = [
                applicationLabel: (betaVer > 0 ? "哔哩终端BETA" : "@string/app_name")
        ]

        multiDexEnabled true

        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters 'armeabi-v7a','x86',"mips"
        }

        resConfigs 'zh'
    }

    signingConfigs {
        release {
            if (hasSigningKey) {
                storeFile signingKeyFile
                storePassword keystoreProps.getProperty("KEY_PASSWORD")
                keyAlias keystoreProps.getProperty("ALIAS_NAME")
                keyPassword keystoreProps.getProperty("ALIAS_PASSWORD")
                // V1 / V2 / V3 三种签名方案全部打开：
                // V1(JAR 签名) 是 Android 7.0 以下唯一认的方案，本项目 minSdk 14，
                // 装到老手表/老手机上必须有 V1，否则会直接报"解析软件包时出现问题"。
                // V2/V3 给新系统用，V4（增量安装的 .idsig）用不上，关掉免得生成多余文件。
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing false
            }
        }
    }

    buildTypes {
        release {
            buildConfigField "boolean", "BETA", String.valueOf(betaVer > 0)
            buildConfigField "boolean", "LOG_DEBUG", "true"
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigningKey) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            buildConfigField "boolean", "BETA", String.valueOf(betaVer > 0)
            // 配了正式密钥时，debug 也用同一把密钥签名。
            // 否则每台电脑、每个 CI runner 自动生成的 debug keystore 都不一样，
            // 装同一个应用就会报"软件包签名不存在或被更改"（必须卸载旧包才能装）。
            if (hasSigningKey) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_9
        targetCompatibility JavaVersion.VERSION_1_9
    }

    packagingOptions {
        exclude 'META-INF/androidx.cardview_cardview.version'
    }
    buildFeatures {
        viewBinding false
    }
}

dependencies {
    //noinspection GradleDependency
    implementation 'com.google.zxing:core:3.3.0'
    //noinspection GradleDependency
    implementation 'androidx.appcompat:appcompat:1.5.1'
    //noinspection GradleDependency
    implementation 'com.google.android.material:material:1.9.0'
    //noinspection GradleDependency
    implementation 'com.squareup.okhttp3:okhttp:3.12.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.github.bumptech.glide:glide:4.13.2'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.13.2'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.13.2'
    //noinspection GradleDependency
    implementation 'org.jsoup:jsoup:1.10.2'
    //noinspection GradleCompatible
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'org.greenrobot:eventbus:3.2.0'
    // Geetest（目前没用到）
    //implementation 'com.geetest.sensebot:sensebot:4.4.2.1'
    //danmaku
    //implementation 'com.github.ctiao:DanmakuFlameMaster:0.9.25'
    //implementation 'com.github.ctiao:ndkbitmap-armv7a:0.9.21'
    //implementation 'com.github.ctiao:ndkbitmap-x86:0.9.21'
    //ijk
    implementation project(path: ':ijkplayer-java')
    implementation project(path: ':DanmakuFlameMaster')
    implementation project(path: ':brotlij')
    implementation 'androidx.asynclayoutinflater:asynclayoutinflater:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    def multidex_version = "2.0.1"
    implementation "androidx.multidex:multidex:$multidex_version"
    implementation "org.brotli:dec:0.1.2"
    implementation "com.aayushatharva.brotli4j:brotli4j:1.16.0"
    implementation 'com.google.protobuf:protobuf-javalite:3.21.12'
}
